<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TinyGPT Chat — 3M-parameter AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b1020; --panel: #131a30; --panel2: #1a2342;
    --accent: #6c8cff; --accent2: #22d3ee; --text: #e8ecf8; --dim: #8b95b3;
    --user: #6c8cff; --bot: #222c52; --err: #ff6b81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #1c2a5e 0%, var(--bg) 55%);
    color: var(--text); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: rgba(15, 21, 42, .8); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(108, 140, 255, .18); position: sticky; top: 0; z-index: 5;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #071022;
  }
  .title { font-weight: 700; font-size: 17px; }
  .subtitle { font-size: 12px; color: var(--dim); }
  .status { margin-left: auto; font-size: 11px; color: var(--dim); text-align: right; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .dot.ok { background: #34d399; box-shadow: 0 0 6px #34d399; }
  .dot.load { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; animation: pulse 1s infinite; }
  .dot.bad { background: var(--err); }
  @keyframes pulse { 50% { opacity: .4; } }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px 14px 90px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45;
         font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #5570e8, var(--accent));
              color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid rgba(108,140,255,.15);
             border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: none; color: var(--dim); font-size: 12.5px; text-align: center; max-width: 92%; }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--dim);
                 animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(11, 16, 32, .92); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(108, 140, 255, .15);
  }
  #input {
    flex: 1; background: var(--panel2); border: 1px solid rgba(108, 140, 255, .25);
    color: var(--text); border-radius: 22px; padding: 12px 16px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    border: none; border-radius: 22px; padding: 0 20px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #071022; cursor: pointer;
  }
  #send:disabled { opacity: .45; }
  .controls { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
  .chipline { font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid rgba(108,140,255,.2);
              padding: 6px 12px; border-radius: 14px; cursor: pointer; user-select: none; }
  .loading-screen { position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: grid; place-items: center; text-align: center; gap: 14px; transition: opacity .4s; }
  .loading-screen .bar { width: 220px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin: 14px auto 0; }
  .loading-screen .bar i { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(320%);} }
</style>
</head>
<body>
<div class="loading-screen" id="loader">
  <div>
    <div class="logo" style="width:64px;height:64px;font-size:24px;margin:0 auto 16px;border-radius:18px">TG</div>
    <div style="font-weight:700;font-size:18px">Loading TinyGPT</div>
    <div class="subtitle" id="loadmsg">fetching 3.2M-parameter brain…</div>
    <div class="bar"><i></i></div>
  </div>
</div>
<header>
  <div class="logo">TG</div>
  <div>
    <div class="title">TinyGPT Chat</div>
    <div class="subtitle">3.2M-param transformer · runs 100% on your device</div>
  </div>
  <div class="status"><span class="dot load" id="dot"></span><span id="status">loading</span></div>
</header>
<div id="chat"></div>
<footer>
  <input id="input" placeholder="Say something…" autocomplete="off" enterkeyhint="send">
  <button id="send">➤</button>
</footer>

<script src="engine.js"></script>
<script>
(async () => {
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const dot = document.getElementById("dot");
  const loadmsg = document.getElementById("loadmsg");

  let model = null, busy = false;
  const history = [];

  function setStatus(kind, text) {
    dot.className = "dot " + kind;
    status.textContent = text;
  }

  function addMsg(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function loadModel() {
    setStatus("load", "loading");
    loadmsg.textContent = "fetching 3.2M-parameter brain…";
    const get = async (url, type) => {
      try { return await (await fetch(url))[type](); }
      catch (e) { // WebView file:// fallback
        return await new Promise((res, rej) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", url);
          xhr.responseType = type === "json" ? "text" : "arraybuffer";
          xhr.onload = () => res(type === "json" ? JSON.parse(xhr.responseText) : xhr.response);
          xhr.onerror = () => rej(xhr.status || new Error("load failed"));
          xhr.send();
        });
      }
    };
    const cfg = await get("config.json", "json");
    loadmsg.textContent = "reading weights…";
    const buf = await get("model.bin", "arraybuffer");
    loadmsg.textContent = "warming up…";
    model = new TinyGPT(cfg, new Float32Array(buf));
    model.reply([{ role: "user", text: "hi" }], { maxNew: 2 });
    const loader = document.getElementById("loader");
    loader.style.opacity = "0";
    setTimeout(() => loader.remove(), 420);
    setStatus("ok", "on-device · offline");
    addMsg("sys", "TinyGPT loaded — " + cfg.nparams.toLocaleString() + " parameters running locally in your browser. It's a tiny model trained from scratch, so replies are simple. Ask it something!");
  }

  async function onSend() {
    const text = input.value.trim();
    if (!text || busy || !model) return;
    busy = true; send.disabled = true; input.value = "";
    addMsg("user", text);
    const typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

    const t0 = performance.now();
    let reply;
    try {
      await new Promise(r => setTimeout(r, 30)); // let typing dots paint
      reply = model.reply(history.concat([{ role: "user", text }]), { temp: 0.75, topk: 40 });
    } catch (e) {
      reply = null;
      setStatus("bad", "error");
      typing.textContent = "⚠ " + e.message;
    }
    typing.remove();
    if (reply !== null) {
      const dt = ((performance.now() - t0) / 1000).toFixed(1);
      history.push({ role: "user", text });
      history.push({ role: "bot", text: reply });
      if (history.length > 6) history.splice(0, 2); // keep context small
      addMsg("bot", reply || "…");
      addMsg("sys", "generated in " + dt + "s · 100% on this device");
    }
    busy = false; send.disabled = false; input.focus();
  }

  send.addEventListener("click", onSend);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") onSend(); });

  try {
    await loadModel();
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  } catch (e) {
    setStatus("bad", "failed");
    loadmsg.textContent = "Failed to load model: " + e.message;
  }
})();
</script>
</body>
</html>
