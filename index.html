<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0a">
<title>TinyGPT Chat — 6M-parameter AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#1f1f1f;
    --bubble-user:#2b2b2b;
    --send:#d37b3a;
    --send-pressed:#c06e30;
    --text:#f2f2f2;
    --dim:#a0a0a0;
    --faint:#6e6e6e;
    --border:rgba(255,255,255,0.08);
    --drawer-bg:#141414;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'DM Sans',-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #161311 0%, #0a0a0a 55%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:var(--app-height,100dvh);padding:0;overflow:hidden;overscroll-behavior:none;
  }

  /* ---------- Phone frame (desktop presentation) ---------- */
  .phone{
    position:relative;width:100%;max-width:420px;height:var(--app-height,100dvh);
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  }
  @media (min-width:520px){
    body{padding:24px 24px 10px}
    .phone{
      height:min(880px,calc(var(--app-height,100dvh) - 96px));
      border-radius:36px;border:1px solid rgba(255,255,255,0.09);
      box-shadow:0 30px 80px rgba(0,0,0,0.65), 0 0 0 8px #17130f, 0 0 0 9px rgba(255,255,255,0.06);
    }
    .caption{color:#5c554e;font-size:12px;margin-top:12px;letter-spacing:0.4px;flex:0 0 auto}
  }
  @media (max-width:519px){
    .caption{display:none}
    /* On phones the app is position:fixed, so the browser's keyboard-driven
       page scrolling can never push the nav up or the input bar away.
       height + top follow the visible area (above the keyboard). */
    .phone{
      position:fixed;top:var(--vv-top,0px);left:0;right:0;margin:0 auto;
    }
  }

  /* ---------- Top nav ---------- */
  .topnav{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:10px 12px 10px 10px;
  }
  .topnav .title{
    font-size:18px;font-weight:500;color:var(--text);
    margin-left:2px;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topnav .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-right:2px}
  .dot.ok{background:#34d399;box-shadow:0 0 6px #34d399}
  .dot.load{background:#fbbf24;box-shadow:0 0 6px #fbbf24;animation:pulse 1s infinite}
  .dot.bad{background:#ff6b81}
  @keyframes pulse{50%{opacity:.4}}
  .iconbtn{
    display:flex;align-items:center;justify-content:center;
    width:42px;height:42px;border:none;border-radius:50%;
    background:transparent;color:var(--dim);cursor:pointer;
    transition:background .15s ease,color .15s ease;flex:0 0 auto;
  }
  .iconbtn:hover{background:rgba(255,255,255,0.07);color:var(--text)}
  .iconbtn:active{background:rgba(255,255,255,0.12)}
  .iconbtn--round{background:rgba(255,255,255,0.08);color:var(--text)}
  .iconbtn--round:hover{background:rgba(255,255,255,0.14)}

  /* ---------- Chat area ---------- */
  .chat{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 16px 18px;
    display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:0}

  /* user message */
  .msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .msg-user .bubble{
    background:var(--bubble-user);color:var(--text);
    padding:10px 16px;border-radius:20px 20px 6px 20px;
    font-size:14px;max-width:80%;
    overflow-wrap:break-word;white-space:pre-wrap;
  }
  .msg-user .copy{
    display:flex;align-items:center;gap:5px;
    background:none;border:none;color:var(--faint);cursor:pointer;
    font-size:12px;font-family:inherit;padding:2px 6px;border-radius:8px;
  }
  .msg-user .copy:hover{color:var(--dim)}
  .msg-user .copy svg{opacity:.8}

  /* AI message */
  .msg-ai{display:flex;flex-direction:column;gap:10px}
  .ai-text{
    color:var(--text);font-size:16px;font-weight:500;line-height:1.5;
    max-width:92%;overflow-wrap:break-word;white-space:pre-wrap;
  }
  .meta{color:var(--faint);font-size:11.5px;font-weight:400;letter-spacing:.2px;margin-top:-4px}
  .actions{display:flex;gap:4px;margin-top:2px}
  .actions .act{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;border:none;background:none;
    color:var(--faint);cursor:pointer;transition:background .15s,color .15s;
  }
  .actions .act:hover{background:rgba(255,255,255,0.07);color:var(--dim)}

  /* typing indicator */
  .typing{display:flex;gap:5px;padding:12px 2px}
  .typing span{
    width:8px;height:8px;border-radius:50%;background:var(--faint);
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.9)}40%{opacity:1;transform:scale(1)}}

  /* loader (model load) */
  .loadwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--faint);font-size:14px}
  .loadbar{width:180px;height:5px;border-radius:3px;background:var(--surface);overflow:hidden}
  .loadbar i{display:block;height:100%;width:35%;background:var(--send);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

  /* ---------- Input bar ---------- */
  .inputbar{
    flex:0 0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 65%, transparent);
  }
  .input-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border-radius:28px;padding:7px 7px 7px 6px;
  }
  .input-pill input{
    flex:1;min-width:0;background:none;border:none;outline:none;
    color:var(--text);font-family:inherit;font-size:14.5px;padding:0 4px;
  }
  .input-pill input::placeholder{color:var(--faint)}
  .sendbtn{
    width:40px;height:40px;border-radius:50%;border:none;flex:0 0 auto;
    background:var(--send);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .1s;
  }
  .sendbtn:hover{background:var(--send-pressed)}
  .sendbtn:active{transform:scale(.93)}
  .sendbtn:disabled{opacity:.45}

  /* ---------- Drawer (chat history) ---------- */
  .overlay{
    position:absolute;inset:0;background:rgba(0,0,0,0.55);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{
    position:absolute;top:0;left:0;bottom:0;width:290px;max-width:82%;
    background:var(--drawer-bg);z-index:50;
    transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;border-right:1px solid var(--border);
  }
  .drawer.show{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 16px 12px;
  }
  .drawer-head .brand{font-size:19px;font-weight:700;color:var(--text);letter-spacing:.2px}
  .drawer-head .close{
    border:none;background:none;color:var(--dim);width:38px;height:38px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .drawer-head .close:hover{background:rgba(255,255,255,0.08)}
  .newchat{
    margin:4px 12px 14px;display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.07);border:none;border-radius:24px;
    padding:11px 16px;color:var(--text);font-family:inherit;font-size:15px;font-weight:500;
    cursor:pointer;transition:background .15s;
  }
  .newchat:hover{background:rgba(255,255,255,0.12)}
  .drawer .hist-label{
    color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;padding:4px 22px 8px;
  }
  .hist{flex:1;overflow-y:auto;padding-bottom:16px}
  .hist::-webkit-scrollbar{width:0}
  .hist-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;cursor:pointer;font-family:inherit;
    padding:7px 20px;color:var(--dim);font-size:14px;
    transition:background .15s,color .15s;
  }
  .hist-item:hover{background:rgba(255,255,255,0.06);color:var(--text)}
  .hist-item.active{background:rgba(211,123,58,0.14);color:var(--text)}
  .hist-item.active svg{color:var(--send)}
  .hist-item svg{flex:0 0 auto;opacity:.75}
  .hist-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-item .pin-btn{
    margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    border:none;background:none;color:var(--faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s,opacity .15s;opacity:.55;
  }
  .hist-item .pin-btn:hover{background:rgba(255,255,255,0.09);color:var(--text);opacity:1}
  .hist-item .pin-btn svg{opacity:1}
  .hist-item.pinned{color:var(--text)}
  .hist-item.pinned .pin-btn{color:var(--send);opacity:1}
  #pinList{flex:0 1 auto;max-height:42%;overflow-y:auto}
  #pinList[hidden]{display:none}
  #pinLabel[hidden]{display:none}

  /* ---------- Settings dropdown (3-dot) ---------- */
  .menu{
    position:absolute;top:96px;right:12px;z-index:60;min-width:210px;
    background:#232323;border:1px solid var(--border);border-radius:14px;
    padding:7px;box-shadow:0 16px 44px rgba(0,0,0,0.6);
    opacity:0;transform:scale(.94) translateY(-6px);transform-origin:top right;
    pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  }
  .menu.show{opacity:1;transform:none;pointer-events:auto}
  .menu button{
    display:flex;align-items:center;gap:12px;width:100%;
    background:none;border:none;cursor:pointer;font-family:inherit;
    color:var(--dim);font-size:14.5px;padding:11px 12px;border-radius:9px;
  }
  .menu button:hover{background:rgba(255,255,255,0.08);color:var(--text)}
  .menu button svg{flex:0 0 auto}
  .menu .info{color:var(--dim);font-size:13px;padding:10px 12px;line-height:1.5}

  /* toast */
  .toast{
    position:absolute;bottom:110px;left:50%;transform:translateX(-50%) translateY(8px);
    background:#2e2e2e;color:var(--text);font-size:13px;font-family:inherit;
    padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- top nav -->
  <header class="topnav">
    <button class="iconbtn" id="menuBtn" aria-label="Chat history">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="dot load" id="dot"></span>
    <div class="title" id="chatTitle">TinyGPT</div>
    <button class="iconbtn iconbtn--round" id="newChatBtn" aria-label="New chat">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <button class="iconbtn" id="dotsBtn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/>
      </svg>
    </button>
  </header>

  <!-- chat -->
  <main class="chat" id="chat">
    <div class="loadwrap" id="loader">
      <div class="loadbar"><i></i></div>
      <div id="loadmsg">loading TinyGPT…</div>
    </div>
  </main>

  <!-- input -->
  <footer class="inputbar">
    <div class="input-pill">
      <input id="msgInput" type="text" placeholder="how are you?" autocomplete="off" aria-label="Message">
      <button class="sendbtn" id="sendBtn" aria-label="Send">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- overlay + drawer -->
  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer" aria-label="Chat history">
    <div class="drawer-head">
      <span class="brand">Chats</span>
      <button class="close" id="drawerClose" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <button class="newchat" id="drawerNewChat">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New chat
    </button>
    <div class="hist-label" id="pinLabel" hidden>Pinned</div>
    <nav class="hist" id="pinList" hidden></nav>
    <div class="hist-label">Recent</div>
    <nav class="hist" id="hist"></nav>
  </aside>

  <!-- settings menu -->
  <div class="menu" id="menu" role="menu">
    <button role="menuitem" id="tempBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span id="tempLabel">Settings &middot; Temperature: balanced</span>
    </button>
    <button role="menuitem" id="helpBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      Help & feedback
    </button>
    <button role="menuitem" id="aboutBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      About
    </button>
  </div>

  <div class="toast" id="toast">Copied</div>
</div>
<div class="caption">TinyGPT Chat — ☰ history (pin chats), + new chat, ⋮ settings</div>

<script src="engine.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const chat = $('chat'), drawer = $('drawer'), overlay = $('overlay'),
        menu = $('menu'), input = $('msgInput'), toast = $('toast'),
        loadmsg = $('loadmsg'), dot = $('dot');

  /* ---------- keyboard-safe viewport ----------
     The app is position:fixed on phones, so the browser cannot scroll the
     page when the on-screen keyboard opens. --app-height / --vv-top track
     the visual viewport (the visible area above the keyboard), and the
     chat stays pinned to the newest messages while it resizes. */
  const vv = window.visualViewport;
  const syncViewport = () => {
    if (vv) {
      document.documentElement.style.setProperty('--app-height', vv.height + 'px');
      document.documentElement.style.setProperty('--vv-top', Math.max(0, vv.offsetTop) + 'px');
    }
    if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
    // while the keyboard opens/closes, keep the newest messages on screen
    if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80) chat.scrollTop = chat.scrollHeight;
  };
  if (vv) {
    vv.addEventListener('resize', syncViewport);
    vv.addEventListener('scroll', syncViewport);
    window.addEventListener('orientationchange', syncViewport);
  }
  window.addEventListener('resize', syncViewport);
  // re-sync a moment after the keyboard starts opening (animation settles late)
  document.addEventListener('focusin', () => setTimeout(syncViewport, 300));
  // safety net: while typing, poll every 300ms — even if the browser fires
  // resize events late or never, the app snaps to the visible area anyway
  let focusPoll = null;
  document.addEventListener('focusin', () => {
    clearInterval(focusPoll);
    focusPoll = setInterval(syncViewport, 300);
  });
  document.addEventListener('focusout', () => {
    setTimeout(() => {
      if (!document.activeElement || document.activeElement === document.body) {
        clearInterval(focusPoll);
        syncViewport();
      }
    }, 300);
  });
  syncViewport();

  let model = null, busy = false, nparams = 0;
  let tempMode = localStorage.getItem('tg_temp') || 'balanced';
  const TEMPS = { precise: 0.3, balanced: 0.75, creative: 1.05 };

  /* ---------- chat sessions (localStorage) ---------- */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function newChatObj(){ return { id: uid(), title: 'New chat', pinned: false, messages: [] }; }
  let chats, cur;
  try { chats = JSON.parse(localStorage.getItem('tg_chats')) || null; } catch (e) { chats = null; }
  if (!Array.isArray(chats) || !chats.length) chats = [newChatObj()];
  cur = chats[0].id;
  const curChat = () => chats.find(c => c.id === cur);
  const save = () => { try { localStorage.setItem('tg_chats', JSON.stringify(chats)); } catch (e) {} };

  /* ---------- drawer / menu / toast ---------- */
  const openDrawer = () => { drawer.classList.add('show'); overlay.classList.add('show'); };
  const closeDrawer = () => { drawer.classList.remove('show'); overlay.classList.remove('show'); };
  const closeMenu = () => menu.classList.remove('show');
  $('menuBtn').addEventListener('click', () => { closeMenu(); openDrawer(); });
  $('drawerClose').addEventListener('click', closeDrawer);
  overlay.addEventListener('click', () => { closeDrawer(); closeMenu(); });
  $('dotsBtn').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('show'); closeDrawer(); });
  document.addEventListener('click', e => {
    if (!menu.contains(e.target) && e.target.closest('#dotsBtn') === null) closeMenu();
  });

  let toastTimer;
  const showToast = msg => {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  };

  /* copy buttons (delegated) */
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    if (navigator.clipboard) navigator.clipboard.writeText(btn.getAttribute('data-copy')).catch(() => {});
    showToast('Copied');
  });

  /* ---------- render chat list ---------- */
  const CHAT_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  const PIN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1"/></svg>';

  function renderDrawer() {
    const pins = chats.filter(c => c.pinned), recents = chats.filter(c => !c.pinned);
    const mk = c => {
      const item = document.createElement('div');
      item.className = 'hist-item' + (c.id === cur ? ' active' : '') + (c.pinned ? ' pinned' : '');
      item.setAttribute('role', 'button'); item.tabIndex = 0;
      item.innerHTML = CHAT_SVG + '<span></span>' +
        '<button class="pin-btn" aria-label="Pin chat" title="Pin">' + PIN_SVG + '</button>';
      item.querySelector('span').textContent = c.title;
      item.addEventListener('click', () => { switchChat(c.id); closeDrawer(); });
      item.addEventListener('keydown', e => { if (e.key === 'Enter') { switchChat(c.id); closeDrawer(); } });
      item.querySelector('.pin-btn').addEventListener('click', e => {
        e.stopPropagation();
        c.pinned = !c.pinned;
        save(); renderDrawer();
        showToast(c.pinned ? 'Chat pinned' : 'Chat unpinned');
      });
      return item;
    };
    const pinList = $('pinList'), hist = $('hist');
    pinList.innerHTML = ''; hist.innerHTML = '';
    pins.forEach(c => pinList.appendChild(mk(c)));
    recents.forEach(c => hist.appendChild(mk(c)));
    $('pinLabel').hidden = pinList.hidden = !pins.length;
  }

  /* ---------- render messages ---------- */
  const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

  function addUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.innerHTML =
      '<div class="bubble"></div>' +
      '<button class="copy" data-copy="" aria-label="Copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy</span></button>';
    div.querySelector('.bubble').textContent = text;
    div.querySelector('.copy').setAttribute('data-copy', text);
    chat.appendChild(div); scrollDown();
  }

  function addAiMsg(text, meta) {
    const div = document.createElement('div');
    div.className = 'msg-ai';
    div.innerHTML =
      '<div class="ai-text"></div>' +
      (meta ? '<div class="meta"></div>' : '') +
      '<div class="actions">' +
        '<button class="act" data-copy="" aria-label="Copy" title="Copy"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>' +
      '</div>';
    div.querySelector('.ai-text').textContent = text;
    if (meta) div.querySelector('.meta').textContent = meta;
    div.querySelector('[data-copy]').setAttribute('data-copy', text);
    chat.appendChild(div); scrollDown();
  }

  function renderChat() {
    chat.innerHTML = '';
    const c = curChat();
    if (!c.messages.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:15px';
      empty.textContent = 'Start a new conversation';
      chat.appendChild(empty);
    } else {
      c.messages.forEach(m => {
        if (m.role === 'user') addUserMsg(m.text);
        else addAiMsg(m.text, m.meta || null);
      });
    }
    $('chatTitle').textContent = c.title === 'New chat' ? 'TinyGPT' : c.title;
  }

  function switchChat(id) { cur = id; renderChat(); renderDrawer(); }

  /* ---------- new chat ---------- */
  function startNewChat() {
    const c = newChatObj();
    chats.unshift(c); cur = c.id;
    save(); renderChat(); renderDrawer(); closeDrawer();
  }
  $('newChatBtn').addEventListener('click', startNewChat);
  $('drawerNewChat').addEventListener('click', startNewChat);

  /* ---------- settings ---------- */
  function tempLabel() { return 'Settings \u00b7 Temperature: ' + tempMode; }
  $('tempLabel').textContent = tempLabel();
  $('tempBtn').addEventListener('click', () => {
    const modes = ['precise', 'balanced', 'creative'];
    tempMode = modes[(modes.indexOf(tempMode) + 1) % modes.length];
    localStorage.setItem('tg_temp', tempMode);
    $('tempLabel').textContent = tempLabel();
    showToast('Sampling: ' + tempMode + ' (' + TEMPS[tempMode] + ')');
  });
  $('aboutBtn').addEventListener('click', () => {
    closeMenu();
    showToast((nparams ? nparams.toLocaleString() + '-parameter ' : '') + 'TinyGPT \u00b7 100% on this device');
  });
  $('helpBtn').addEventListener('click', () => {
    closeMenu();
    window.open('https://github.com/samratbarman1013-commits/tinygpt-chat', '_blank');
  });

  /* ---------- backend: on-device engine ---------- */
  function setDot(kind) {
    dot.className = 'dot ' + kind;
    dot.title = kind === 'ok' ? 'model ready' : kind === 'bad' ? 'failed' : 'loading';
  }

  async function loadModel() {
    setDot('load');
    const get = async (url, type) => {
      try { return await (await fetch(url))[type](); }
      catch (e) { // WebView file:// fallback
        return await new Promise((res, rej) => {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url);
          xhr.responseType = type === 'json' ? 'text' : 'arraybuffer';
          xhr.onload = () => res(type === 'json' ? JSON.parse(xhr.responseText) : xhr.response);
          xhr.onerror = () => rej(xhr.status || new Error('load failed'));
          xhr.send();
        });
      }
    };
    loadmsg.textContent = 'fetching model…';
    const cfg = await get('config.json', 'json');
    nparams = cfg.nparams;
    loadmsg.textContent = 'reading weights…';
    const buf = await get('model.bin', 'arraybuffer');
    loadmsg.textContent = 'warming up…';
    model = new TinyGPT(cfg, new Float32Array(buf));
    model.reply([{ role: 'user', text: 'hi' }], { maxNew: 2 });
    $('loader').remove();
    setDot('ok');
    const c = curChat();
    if (c.title === 'New chat') c.title = 'Welcome';
    c.messages.push({ role: 'bot', text: 'Hi! I\u2019m TinyGPT \u2014 ' + nparams.toLocaleString() + ' parameters running 100% on this device. I\u2019m tiny and trained from scratch, so keep it simple \u2014 ask me something!', meta: 'on-device \u00b7 offline' });
    save(); renderChat(); renderDrawer();
  }

  /* ---------- send ---------- */
  async function send() {
    const text = input.value.trim();
    if (!text || busy || !model) return;
    busy = true; $('sendBtn').disabled = true; input.value = '';
    const c = curChat();
    if (c.title === 'New chat' || c.title === 'Welcome') {
      c.title = text.length > 26 ? text.slice(0, 26) + '\u2026' : text;
    }
    c.messages.push({ role: 'user', text });
    if ($('loader')) $('loader').remove();
    addUserMsg(text); save(); renderDrawer();

    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(t); scrollDown();

    const t0 = performance.now();
    let reply = null, meta = '';
    try {
      await new Promise(r => setTimeout(r, 30));
      const hist = c.messages.slice(-7, -1).map(m => ({ role: m.role, text: m.text }));
      reply = model.reply(hist, { temp: TEMPS[tempMode], topk: 40 });
      const dt = ((performance.now() - t0) / 1000).toFixed(1);
      meta = 'generated in ' + dt + 's \u00b7 100% on this device';
    } catch (e) {
      setDot('bad');
      reply = '\u26a0 ' + e.message;
    }
    t.remove();
    c.messages.push({ role: 'bot', text: reply || '\u2026', meta });
    addAiMsg(reply || '\u2026', meta);
    save(); scrollDown();
    busy = false; $('sendBtn').disabled = false;
    // keep focus only on desktop (no on-screen keyboard there) — on phones
    // the keyboard should NOT auto-open again after sending a message
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) input.focus();
  }

  $('sendBtn').addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  /* ---------- boot ---------- */
  renderChat(); renderDrawer();
  loadModel().then(() => {
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }).catch(e => {
    setDot('bad');
    loadmsg.textContent = 'Failed to load model: ' + e.message;
  });
})();
</script>
</body>
</html>
