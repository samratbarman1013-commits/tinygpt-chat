<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TinyGPT Chat — online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236c8cff'/><text x='50' y='66' font-size='44' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23071022'>TG</text></svg>">
<style>
  :root {
    --bg: #0b1020; --panel2: #1a2342;
    --accent: #6c8cff; --accent2: #22d3ee; --text: #e8ecf8; --dim: #8b95b3;
    --bot: #222c52; --err: #ff6b81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #1c2a5e 0%, var(--bg) 55%);
    color: var(--text); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: rgba(15, 21, 42, .8); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(108, 140, 255, .18); position: sticky; top: 0; z-index: 5;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #071022;
  }
  .title { font-weight: 700; font-size: 17px; }
  .subtitle { font-size: 12px; color: var(--dim); }
  .status { margin-left: auto; font-size: 11px; color: var(--dim); text-align: right; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .dot.ok { background: #34d399; box-shadow: 0 0 6px #34d399; }
  .dot.bad { background: var(--err); }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px 14px 90px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45;
         font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #5570e8, var(--accent));
              color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid rgba(108,140,255,.15);
             border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: none; color: var(--dim); font-size: 12.5px; text-align: center; max-width: 92%; }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(11, 16, 32, .92); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(108, 140, 255, .15);
  }
  #input {
    flex: 1; background: var(--panel2); border: 1px solid rgba(108, 140, 255, .25);
    color: var(--text); border-radius: 22px; padding: 12px 16px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    border: none; border-radius: 22px; padding: 0 20px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #071022; cursor: pointer;
  }
  #send:disabled { opacity: .45; }
</style>
</head>
<body>
<header>
  <div class="logo">TG</div>
  <div>
    <div class="title">TinyGPT Chat</div>
    <div class="subtitle">1M-param transformer · server mode</div>
  </div>
  <div class="status"><span class="dot ok" id="dot"></span><span id="status">online</span></div>
</header>
<div id="chat"></div>
<footer>
  <input id="input" placeholder="Say something…" autocomplete="off" enterkeyhint="send">
  <button id="send">➤</button>
</footer>

<script>
(async () => {
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const dot = document.getElementById("dot");

  let busy = false;
  const history = [];

  function setStatus(kind, text) {
    dot.className = "dot " + kind;
    status.textContent = text;
  }

  function addMsg(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function onSend() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true; input.value = "";
    addMsg("user", text);
    const typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;

    const t0 = performance.now();
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.concat([{ role: "user", text }]) })
      });
      if (!res.ok) throw new Error("server error " + res.status);
      const data = await res.json();
      const dt = ((performance.now() - t0) / 1000).toFixed(1);
      history.push({ role: "user", text });
      history.push({ role: "bot", text: data.reply });
      if (history.length > 6) history.splice(0, 2);
      typing.remove();
      addMsg("bot", data.reply || "…");
      addMsg("sys", "server-generated in " + dt + "s · via internet");
      setStatus("ok", "online");
    } catch (e) {
      typing.remove();
      addMsg("bot", "⚠ could not reach the server: " + e.message);
      setStatus("bad", "offline");
    }
    busy = false; send.disabled = false; input.focus();
  }

  send.addEventListener("click", onSend);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") onSend(); });

  // wait for the server to finish loading the model
  setStatus("ok", "connecting…");
  for (let i = 0; i < 60; i++) {
    try {
      const h = await fetch("/health");
      if (h.ok) break;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  setStatus("ok", "online · server-side AI");
  addMsg("sys", "TinyGPT online — 983,488-parameter transformer running on the server. Chat happens over the internet; nothing runs on your phone.");
})();
</script>
</body>
</html>
